global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: waf                 # metriche WAF + nginx del WAF + host + Vector (servizio metrics)
    static_configs:
      - targets: ["metrics:9598"]
  - job_name: clickhouse          # salute del database dei log
    static_configs:
      - targets: ["clickhouse:9363"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
