# Stack completo in locale, tutto in HTTP sulla porta 80:
#
#   browser ──:80──► waf ──► nginx ──┬──► odoo (14) ──► db (postgres 13)
#                     │              └──► grafana ──┬──► prometheus ──► metrics (:9598)
#                     │                             └──► clickhouse (log)
#                     └── log ──► metrics (Vector) ──┬──► :9598/metrics
#                                                    └──► clickhouse: waf.events, waf.matches
#
#   http://odoo.localhost      Odoo 14    (admin / admin)
#   http://localhost:3000      Grafana    (admin / admin), cartella "WAF"  (anche http://grafana.localhost, via WAF)
#
#   docker compose up -d        (primo avvio: 1-3 minuti)
#
# Tutti i dati sono bind mount in ./data e ./logs. Guida: README.md

# Password ClickHouse (stack locale: valori fissi, cambiali in .env se serve)
x-ch-passwords: &ch-passwords
  WAF_CH_ADMIN_PASSWORD: ${WAF_CH_ADMIN_PASSWORD:-waf_admin}
  WAF_CH_INGEST_PASSWORD: ${WAF_CH_INGEST_PASSWORD:-waf_ingest}
  WAF_CH_RO_PASSWORD: ${WAF_CH_RO_PASSWORD:-waf_ro}

services:

  # ============================================================ permessi dei bind mount
  # Crea le cartelle in ./data con il proprietario giusto per ogni servizio, poi esce.
  init-dirs:
    image: ${WAF_IMAGE:-nginx-aws-waf/aio:latest}
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /data/odoo /data/grafana /data/prometheus /data/postgres /data/clickhouse /data/geoip /data/runtime /data/lists /data/state /data/raw /data/vector
        chown -R 101:101 /data/odoo
        chown -R 472:0 /data/grafana
        chown -R 65534:65534 /data/prometheus
    volumes:
      - ./data:/data
    restart: "no"

  # ============================================================ WAF
  # Unico servizio esposto. Ispeziona ogni richiesta (regole AWS, profilo odoo-14) e la passa a nginx.
  waf:
    image: ${WAF_IMAGE:-nginx-aws-waf/aio:latest}
    build:
      context: ..
      dockerfile: deploy-waf/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      WAF_NODE_ID: odoo-local
      WAF_UPSTREAM: ""                  # i siti sono in config/sites/ (odoo.yaml, grafana.yaml)
      WAF_DEFAULT_SITE: odoo            # qualunque altro Host (es. localhost) va a Odoo
      WAF_WATCH_INTERVAL: "10"          # modifiche a config/sites/ applicate entro 10 s
      WAF_GEOIP: ${WAF_GEOIP:-false}    # true = regole geo/geo_block nel WAF (servono i .mmdb in data/geoip)
      # per "docker compose exec waf wafctl logs/stats/report" (lettura da ClickHouse)
      WAF_CH_URL: http://clickhouse:8123
      WAF_CH_USER: waf_ro
      WAF_CH_PASSWORD: ${WAF_CH_RO_PASSWORD:-waf_ro}
    volumes:
      - ./config:/config:ro
      - ./logs:/var/log/waf
      - ./data/runtime:/etc/waf/runtime
      - ./data/lists:/etc/waf/lists
      - ./data/state:/srv/waf/state
      - ./data/raw:/srv/waf/raw
      - ./data/geoip:/etc/waf/geoip:ro
    tmpfs: [/tmp]
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    depends_on:
      init-dirs: {condition: service_completed_successfully}
      nginx: {condition: service_started}

  # ============================================================ METRICHE WAF
  # Legge i log del WAF: metriche Prometheus (:9598/metrics), eventi in ClickHouse e in JSONL (data/raw).
  # Paese/ASN negli eventi solo se data/geoip contiene i database (vedi servizi geoip-*).
  metrics:
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        geo=/etc/vector/geoip-off.yaml
        if [ -s /etc/waf/geoip/GeoLite2-Country.mmdb ] && [ -s /etc/waf/geoip/GeoLite2-ASN.mmdb ]; then geo=/etc/vector/geoip-on.yaml; fi
        echo "metrics: GeoIP $$(basename $$geo .yaml)"
        exec vector --config /etc/vector/node.yaml --config /etc/vector/metrics.yaml \
          --config /etc/vector/clickhouse.yaml --config $$geo \
          --config /etc/waf/runtime/current/vector/forward.yaml
    volumes:
      - ./vector:/etc/vector:ro
      - ./logs:/var/log/waf:ro
      - ./data/runtime:/etc/waf/runtime:ro
      - ./data/raw:/var/lib/waf/raw
      - ./data/vector:/var/lib/vector
      - ./data/geoip:/etc/waf/geoip:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys
      WAF_CH_INGEST_PASSWORD: ${WAF_CH_INGEST_PASSWORD:-waf_ingest}
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"   # serve per ${WAF_CH_INGEST_PASSWORD} in clickhouse.yaml
    depends_on:
      waf: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  # ============================================================ NGINX
  # Il "tuo" nginx: config classica per Odoo + Grafana. Nessuna porta esposta.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on: [odoo, grafana]

  # ============================================================ ODOO 14
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      retries: 20
    depends_on:
      init-dirs: {condition: service_completed_successfully}

  # Crea il database "odoo" al primo avvio (moduli + dati demo), poi esce. Agli avvii successivi non fa nulla.
  odoo-init:
    image: odoo:14
    entrypoint: ["/bin/bash", "/odoo-init.sh"]
    environment:
      ODOO_DB: odoo
      ODOO_MODULES: ${ODOO_MODULES:-contacts,sale_management,crm}
      ODOO_DEMO: ${ODOO_DEMO:-true}
    volumes:
      - ./odoo/odoo-init.sh:/odoo-init.sh:ro
      - ./data/odoo:/var/lib/odoo
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  odoo:
    image: odoo:14
    restart: unless-stopped
    command: ["odoo", "-d", "odoo", "--db-filter=^odoo$$", "--no-database-list", "--proxy-mode",
              "--workers=2", "--longpolling-port=8072", "--max-cron-threads=1",
              "--limit-time-real=600"]
    environment:
      HOST: db                          # l'entrypoint dell'immagine aggiunge --db_host/--db_user/--db_password
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./data/odoo:/var/lib/odoo       # filestore e sessioni
      # - ./addons:/mnt/extra-addons    # moduli personalizzati
    depends_on:
      odoo-init: {condition: service_completed_successfully}

  # ============================================================ GEOIP (a richiesta)
  # Non partono con "up": si lanciano a mano e scrivono i .mmdb in data/geoip. Poi: docker compose restart metrics
  #   docker compose run --rm geoip-dbip       # DB-IP Lite, gratuito, senza account (CC BY 4.0)
  #   docker compose run --rm geoip-maxmind    # MaxMind GeoLite2, serve account gratuito (GEOIPUPDATE_* nel .env)
  geoip-dbip:
    image: ${WAF_IMAGE:-nginx-aws-waf/aio:latest}
    profiles: [geoip]
    entrypoint: ["sh", "/dbip.sh"]
    volumes:
      - ./geoip/dbip.sh:/dbip.sh:ro
      - ./data/geoip:/geoip
    restart: "no"

  geoip-maxmind:
    image: maxmindinc/geoipupdate:v8.0.0
    profiles: [geoip]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country GeoLite2-ASN
    volumes:
      - ./data/geoip:/usr/share/GeoIP
    restart: "no"

  # ============================================================ LOG (ClickHouse)
  # Database dei log del WAF: una riga per richiesta (waf.events) e per regola matchata (waf.matches).
  # Schema e utenti creati al primo avvio da clickhouse/initdb/. Non esposto: lo usano Grafana e wafctl.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    restart: unless-stopped
    environment:
      <<: *ch-passwords
      CLICKHOUSE_USER: waf_admin
      CLICKHOUSE_PASSWORD: ${WAF_CH_ADMIN_PASSWORD:-waf_admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/waf.xml:/etc/clickhouse-server/config.d/waf.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      init-dirs: {condition: service_completed_successfully}

  # ============================================================ MONITORAGGIO
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    depends_on:
      init-dirs: {condition: service_completed_successfully}

  grafana:
    image: grafana/grafana:13.2.7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # in locale si vede la dashboard anche senza login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/waf-overview.json
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.24.0   # datasource ClickHouse (scaricato al primo avvio)
      WAF_CH_RO_PASSWORD: ${WAF_CH_RO_PASSWORD:-waf_ro}                    # usata in provisioning/datasources
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"            # accesso diretto: http://localhost:3000 (senza WAF)
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      init-dirs: {condition: service_completed_successfully}
      prometheus: {condition: service_started}
      clickhouse: {condition: service_healthy}
