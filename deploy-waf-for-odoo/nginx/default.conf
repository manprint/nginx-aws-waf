# Config nginx "classica" per Odoo 14 + Grafana.
# nginx non è esposto: riceve solo il traffico già filtrato dal WAF.

upstream odoo     { server odoo:8069; }
upstream odoochat { server odoo:8072; }   # longpolling (chat, notifiche)
upstream grafana  { server grafana:3000; }

# L'IP reale del client arriva dal WAF in X-Forwarded-For / X-Real-IP: lo passiamo così com'è.

# ---------------------------------------------------------------- Odoo
server {
    listen 80 default_server;
    server_name odoo.localhost localhost;

    client_max_body_size 100m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP         $http_x_real_ip;

    location /longpolling {
        proxy_pass http://odoochat;
    }

    location / {
        proxy_redirect off;
        proxy_pass http://odoo;
    }

    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        expires 864000;
        proxy_pass http://odoo;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json;
}

# ---------------------------------------------------------------- Grafana
server {
    listen 80;
    server_name grafana.localhost;

    location / {
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_pass http://grafana;
    }
}
