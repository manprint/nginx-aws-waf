apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: ClickHouse
    uid: ch
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: waf_ro
      defaultDatabase: waf
    secureJsonData:
      password: $WAF_CH_RO_PASSWORD
