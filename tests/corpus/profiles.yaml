    path: /adminer.php
  expect:
    status: 403
    terminating_rule: BlockDbAdminTools
- id: php-wrapper
  site: p-wordpress
  request:
    path: /index.php?page=php://filter/convert.base64-encode/resource=index
  expect:
    status: 403
    terminating_rule: PHPHighRiskMethodsVariables_QUERYSTRING
- id: php-thinkphp
  site: p-wordpress
  request:
    path: /index.php?s=/index/think/app/invokefunction&function=call_user_func_array&vars%5B0%5D=system&vars%5B1%5D%5B%5D=id
  expect:
    status: 403
    terminating_rule: PHPHighRiskMethodsVariables_QUERYSTRING
- id: php-cgi-args
  site: p-wordpress
