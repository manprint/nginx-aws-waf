# Site profiles (profiles/web-common, php, wordpress, static, api, aspnet) and the optional AWS use-case
# groups they enable (Linux, POSIX, Windows, PHP, WordPress). Lab sites p-<profile> (lab/config/sites/p-*.yaml).
# Generated from requests run against the profiles; terminating_rule is the first rule that blocks.
version: 1
cases:
- id: wp-home
  site: p-wordpress
  request:
    path: /
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-search
  site: p-wordpress
  request:
    path: /?s=how+to+install+plugins
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-theme-css
  site: p-wordpress
  request:
    path: /wp-content/themes/twentytwentyfour/style.css?ver=6.5
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-login-form
  site: p-wordpress
  request:
    path: /wp-login.php
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-login-post
  site: p-wordpress
  request:
    method: POST
    path: /wp-login.php
    body: log=admin&pwd=S3cret%21%24%28x%29&wp-submit=Log+In&redirect_to=%2Fwp-admin%2F&testcookie=1
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-heartbeat
  site: p-wordpress
  request:
    method: POST
    path: /wp-admin/admin-ajax.php
    body: action=heartbeat&_nonce=abc123&data%5Bwp-refresh-post-lock%5D%5Bpost_id%5D=12
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-rest-posts
  site: p-wordpress
  request:
    path: /wp-json/wp/v2/posts?per_page=10
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-cron
  site: p-wordpress
  request:
    path: /wp-cron.php?doing_wp_cron=1716900000.1234
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-comment-clean
  site: p-wordpress
  request:
    method: POST
    path: /wp-comments-post.php
    body: comment=Great+post%2C+thanks%21+I+use+id+and+env+too&author=Mario&email=m%40x.it&comment_post_ID=12
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-editor-classic
  site: p-wordpress
  request:
    method: POST
    path: /wp-admin/post.php
    body: post_title=Shell+tips&content=%3Cp%3ERun+%3Ccode%3Ecat+%2Fetc%2Fpasswd%3C%2Fcode%3E+and+%3Cscript%3Ealert(1)%3C%2Fscript%3E+%3C%3Fphp+echo+%24_GET%5Bx%5D%3B+%3F%3E%3C%2Fp%3E&action=editpost&post_ID=12
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-editor-rest
  site: p-wordpress
  request:
    method: POST
    path: /wp-json/wp/v2/posts/12
    body: '{"content":"<p>select * from users where id=1 union select 1</p><script>alert(1)</script>"}'
    content_type: application/json
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-author-logged-in
  site: p-wordpress
  request:
    path: /?author=1
    headers:
      Cookie: wordpress_logged_in_abc=admin%7C123
  expect:
    status: 200
    terminating_rule: Default_Action
- id: wp-xmlrpc
  site: p-wordpress
  request:
    path: /xmlrpc.php
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-config
  site: p-wordpress
  request:
    path: /wp-config.php
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-config-backup
  site: p-wordpress
  request:
    path: /wp-config.php~
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-install
  site: p-wordpress
  request:
    path: /wp-admin/install.php
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-upload-php
  site: p-wordpress
  request:
    path: /wp-content/uploads/x.phtml
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-wlwmanifest
  site: p-wordpress
  request:
    path: /wp-includes/wlwmanifest.xml
  expect:
    status: 403
    terminating_rule: WordPressExploitablePaths_URIPATH
- id: wp-file-manager
  site: p-wordpress
