# Core rule set (site demo), one case per rule with a detector; from snippets/reference-cases.py.
version: 1
cases:
- id: crs-noua
  site: demo
  request:
    headers:
      User-Agent: ''
  expect:
    status: 403
    terminating_rule: NoUserAgent_HEADER
- id: crs-badbot
  site: demo
  request:
    headers:
      User-Agent: Mozilla/5.0 nikto/2.1
  expect:
    status: 403
    terminating_rule: UserAgent_BadBots_HEADER
- id: crs-size-query
  site: demo
  request:
    path: /?
  expect:
    status: 403
    terminating_rule: SizeRestrictions_QUERYSTRING
- id: crs-size-cookie
  site: demo
  request:
    headers:
      Cookie: 
  expect:
    status: 403
    terminating_rule: SizeRestrictions_Cookie_HEADER
- id: crs-size-body
  site: demo
  request:
    method: POST
    body_repeat:
      char: x
      count: 9000
      prefix: a=
  expect:
    status: 403
    terminating_rule: SizeRestrictions_BODY
- id: crs-size-body-chunked
  site: demo
  request:
    method: POST
    chunked: true
    body_repeat:
      char: x
      count: 9000
      prefix: a=
  expect:
    status: 403
    terminating_rule: SizeRestrictions_BODY
- id: crs-size-uripath
  site: demo
  request:
    path: 
  expect:
    status: 403
    terminating_rule: SizeRestrictions_URIPATH
- id: crs-ec2-body
  site: demo
  request:
    method: POST
    body: u=http://169.254.169.254/latest/meta-data/
  expect:
    status: 403
    terminating_rule: EC2MetaDataSSRF_BODY
- id: crs-ec2-cookie
  site: demo
  request:
    headers:
      Cookie: u=http%3A%2F%2F169.254.169.254%2F
  expect:
    status: 403
    terminating_rule: EC2MetaDataSSRF_COOKIE
- id: crs-ec2-uripath
  site: demo
  request:
    path: /x/169.254.169.254/latest
  expect:
    status: 403
    terminating_rule: EC2MetaDataSSRF_URIPATH
- id: crs-ec2-query
  site: demo
  request:
    path: /?u=http://169.254.169.254/latest/
  expect:
    status: 403
    terminating_rule: EC2MetaDataSSRF_QUERYARGUMENTS
- id: crs-lfi-query
  site: demo
  request:
    path: /?f=../../etc/passwd
  expect:
    status: 403
    terminating_rule: GenericLFI_QUERYARGUMENTS
- id: crs-lfi-query-encoded
  site: demo
  request:
    path: /?f=%2e%2e%2f%2e%2e%2fx
  expect:
    status: 403
    terminating_rule: GenericLFI_QUERYARGUMENTS
- id: crs-lfi-uripath
  site: demo
  request:
    path: /a/b/../c
  expect:
    status: 403
    terminating_rule: GenericLFI_URIPATH
- id: crs-lfi-body
  site: demo
  request:
    method: POST
    body: f=../../x
  expect:
    status: 403
    terminating_rule: GenericLFI_BODY
- id: crs-lfi-body-json
  site: demo
  request:
    method: POST
    content_type: application/json
    body: '{"f":"../../x"}'
  expect:
    status: 403
    terminating_rule: GenericLFI_BODY
- id: crs-ext-uripath
  site: demo
  request:
    path: /backup/site.bak
  expect:
    status: 403
    terminating_rule: RestrictedExtensions_URIPATH
- id: crs-ext-query
  site: demo
  request:
    path: /?f=config.ini
  expect:
    status: 403
    terminating_rule: RestrictedExtensions_QUERYARGUMENTS
- id: crs-rfi-query
  site: demo
  request:
    path: /?u=http://10.1.2.3/x
  expect:
    status: 403
    terminating_rule: GenericRFI_QUERYARGUMENTS
- id: crs-rfi-body
  site: demo
  request:
    method: POST
    body: u=ftp://192.168.1.1/x
  expect:
    status: 403
    terminating_rule: GenericRFI_BODY
- id: crs-rfi-uripath
  site: demo
  request:
    path: /go/http://10.1.2.3/x
  expect:
    status: 403
    terminating_rule: GenericRFI_URIPATH
- id: crs-xss-cookie
  site: demo
  request:
    headers:
      Cookie: s=<script>alert(1)</script>
  expect:
    status: 403
    terminating_rule: CrossSiteScripting_COOKIE
- id: crs-xss-query
  site: demo
  request:
    path: /?q=<script>alert(1)</script>
  expect:
    status: 403
    terminating_rule: CrossSiteScripting_QUERYARGUMENTS
- id: crs-xss-body
  site: demo
  request:
    method: POST
    body: q=<img src=x onerror=alert(1)>
  expect:
    status: 403
    terminating_rule: CrossSiteScripting_BODY
- id: crs-xss-multipart
  site: demo
  request:
    method: POST
    multipart:
      field: f
      filename: x.html
      content: <script>alert(1)</script>
  expect:
    status: 403
    terminating_rule: CrossSiteScripting_BODY
- id: crs-xss-uripath
  site: demo
  request:
    path: /%3Cscript%3Ealert(1)%3C/script%3E
  expect:
    status: 403
    terminating_rule: CrossSiteScripting_URIPATH
- id: clean-get
  site: demo
  request:
    path: /web?x=1
  expect:
    status: 200
    terminating_rule: Default_Action
- id: clean-json-rpc
  site: demo
  request:
    method: POST
    path: /web/dataset/call_kw
    content_type: application/json
    body: '{"jsonrpc":"2.0","method":"call","params":{"model":"res.partner","method":"read","args":[[1]]}}'
  expect:
    status: 200
    terminating_rule: Default_Action
- id: clean-post-form
  site: demo
  request:
    method: POST
    path: /web/login
    body: login=admin&password=secret&redirect=
  expect:
    status: 200
    terminating_rule: Default_Action
