# Le tue config nginx normali, invariate.
server {
    listen 80;
    server_name app.interno.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.interno.local;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    location / {
        return 200 "ciao da nginx, client=$http_x_real_ip\n";   # qui il tuo proxy_pass / root
    }
}
