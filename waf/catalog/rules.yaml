      - id: 1400070
        name: SQLi_COOKIE
        label: SQLi_Cookie
        default_action: block
        fidelity: approx
        detectors:
          - [{vars: "REQUEST_COOKIES", op: "@detectSQLi", t: [utf8toUnicode, urlDecodeUni, removeNulls]}]
      - id: 1400080
        name: SQLi_URIPATH
        label: SQLi_URIPath
        default_action: block
