# Costruisce e pubblica su GitHub Container Registry (ghcr.io) tutte le immagini custom del progetto.
#
#   ghcr.io/<owner>/<repo>/aio    WAF all-in-one (deploy-waf/, deploy-waf-for-odoo/)   deploy-waf/Dockerfile
#   ghcr.io/<owner>/<repo>/waf    motore del nodo WAF (deploy/compose/node.yml)       waf/Dockerfile
#   ghcr.io/<owner>/<repo>/nikto  scanner del lab (deploy/compose/lab-tools.yml)      lab/nikto/Dockerfile
#
# Tag prodotti:
#   push su main        → latest, <sha8>
#   push del tag vX.Y.Z → vX.Y.Z, <sha8>, latest
#   pull request        → solo build di verifica, niente push
#   workflow_dispatch   → come un push sul branch scelto (latest solo se è main)
#
# Rilascio di una versione:  git tag v1.2.3 && git push origin v1.2.3
name: images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # lunghezza dello sha nel tag (default dell'action: 7)
  DOCKER_METADATA_SHORT_SHA_LENGTH: 8

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aio
            dockerfile: deploy-waf/Dockerfile
            platforms: linux/amd64,linux/arm64
            # in CI le liste IP non sono nel repo (gitignored): le scarica durante la build
            build-args: |
              FETCH_LISTS=1
          - image: waf
            dockerfile: waf/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: ""
          - image: nikto
            dockerfile: lab/nikto/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Nome immagine (minuscolo)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Versione (tag vX.Y.Z oppure sha8)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME}"; else v="${GITHUB_SHA::8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag e label
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short
            type=semver,pattern=v{{version}}
          labels: |
            org.opencontainers.image.title=nginx-aws-waf-${{ matrix.image }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WAF_VERSION=${{ steps.ver.outputs.version }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

      - name: Riepilogo
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
