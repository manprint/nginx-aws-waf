# site shadow — generated by wafctl, DO NOT EDIT
upstream up_shadow { zone up_shadow 64k; server echo:8081 resolve; keepalive 32; }
server {
  listen 8080;
  listen [::]:8080;
  server_name shadow.lab.test;
  set $waf_site shadow; set $waf_app generic;
  modsecurity_rules_file /etc/waf/runtime/20260102T030405Z-450ade3a/modsec/sites/shadow.conf;
  client_max_body_size 10m;
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Forwarded-For; real_ip_recursive on;
  error_page 403 /__waf/403.html; error_page 500 /__waf/500.html;
  location ^~ /__waf/ { internal; modsecurity off; alias /etc/waf/runtime/20260102T030405Z-450ade3a/static/shadow/; default_type text/html; etag off; more_set_headers "Server: awselb/2.0"; }
  location / {
    proxy_pass http://up_shadow;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}

