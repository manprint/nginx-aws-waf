# tuned (lab) without xff and path_overrides: aws-compatible
version: 1
site_id: tunedaws
server_names: [tuned.example.com]
app: generic
upstream: {servers: ["10.0.0.1:8080"]}
body_limit: 16384
fail: {pcre_limit: open}
rule_groups:
  - name: AWSManagedRulesCommonRuleSet
    rule_action_overrides: {SizeRestrictions_BODY: count}
  - name: AWSManagedRulesKnownBadInputsRuleSet
    scope_down: {all: [{uri_path: {starts_with: /static-ok/}, negate: true}]}
custom_rules:
  - name: BlockLargeBodyOutsideRpc
    slot: after:AWSManagedRulesCommonRuleSet
    action: block
    match:
      all:
        - {label: "awswaf:managed:aws:core-rule-set:SizeRestrictions_Body"}
        - {uri_path: {regex: "^/web/(dataset|webclient)/", transform: [urlDecodeUni, lowercase]}, negate: true}
