# VERIFIED probe config (2026-11-26): access log_format + http-level modsecurity + realip. Reference only.
load_module modules/ngx_http_modsecurity_module.so;
worker_processes 2; error_log /dev/stderr warn; pid /tmp/nginx.pid;
events { worker_connections 1024; }
http { client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt;
 map "" $waf_node { default "lab-node-1"; }
 log_format waf_json escape=json '{"ts":"$time_iso8601","msec":"$msec","rid":"$request_id","site":"$waf_site","app":"$waf_app","node":"$waf_node","host":"$host","ra":"$remote_addr","rp":"$remote_port","realip":"$realip_remote_addr","method":"$request_method","scheme":"$scheme","proto":"$server_protocol","uri":"$request_uri","status":$status,"bytes":$bytes_sent,"req_len":$request_length,"rt":$request_time,"urt":"$upstream_response_time","ust":"$upstream_status","uaddr":"$upstream_addr","ua":"$http_user_agent","ref":"$http_referer","ct":"$content_type","cl":"$content_length","rl":"$limit_req_status","ssl":"$ssl_protocol"}';
 server { listen 127.0.0.1:8081; access_log off; modsecurity off; location / { return 200 ok; } }
 modsecurity on; modsecurity_rules_file /etc/waf/main.conf; modsecurity_transaction_id "$request_id";
 set_real_ip_from 0.0.0.0/0; real_ip_header X-Forwarded-For; large_client_header_buffers 4 16k;
 server { listen 8080; set $waf_site shop; set $waf_app odoo; access_log /var/log/waf/access.log waf_json; client_max_body_size 10m; location / { proxy_pass http://127.0.0.1:8081; } } }
