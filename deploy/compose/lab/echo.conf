# echo backend for the lab (no ModSecurity module loaded)
pid /tmp/echo.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/echo_body;
  client_max_body_size 200m;
  server {
    listen 8081;
    listen 8072;
    location / { return 200 "echo $request_method $uri\n"; }
  }
}
