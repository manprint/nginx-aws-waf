services:
  waf:
    ports: ["${WAF_HTTP_PORT:-8080}:${WAF_HTTP_PORT:-8080}", "${WAF_HTTPS_PORT:-8443}:${WAF_HTTPS_PORT:-8443}"]   # from node.yaml listen (exported by wafctl)
    networks:
      lab:
        aliases: [waf, shop12.lab.test, shop14.lab.test, shop16.lab.test, shop18.lab.test]   # lab: Playwright reaches the sites by name
  vector:
    networks: [lab]
networks:
  lab:
    name: waf_lab
    external: false
