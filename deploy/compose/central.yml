# Central storage (project "waf"): ClickHouse + central Vector. Role central, or all-in-one with node.yml.
# Secrets: compose is invoked with --env-file $WAF_CONFIG_DIR/secrets.env (wafctl secrets init).
name: waf
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: waf_admin
      CLICKHOUSE_PASSWORD: ${WAF_CH_ADMIN_PASSWORD:?run wafctl secrets init}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      WAF_CH_INGEST_PASSWORD: ${WAF_CH_INGEST_PASSWORD:?}
      WAF_CH_RO_PASSWORD: ${WAF_CH_RO_PASSWORD:?}
    volumes:
      - ${WAF_CENTRAL_DIR}/clickhouse:/var/lib/clickhouse
      - ../clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ../clickhouse/config.d/waf.xml:/etc/clickhouse-server/config.d/waf.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports: ["127.0.0.1:8123:8123"]
    networks: [central]
  vector-central:
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      WAF_CH_INGEST_PASSWORD: ${WAF_CH_INGEST_PASSWORD:?}
      # Vector >= 0.62 no longer interpolates ${VAR} in config files unless allowed explicitly;
      # central.yaml needs it only for the ClickHouse ingest password.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    volumes:
      - ../vector/central.yaml:/etc/vector/vector.yaml:ro
      - ${WAF_CENTRAL_DIR}/vector:/var/lib/vector
      - ${WAF_DATA_DIR}/geoip:/etc/waf/geoip:ro
    # not published: remote nodes come through the mTLS ingress; all-in-one bridge uses the
    # shared network, all-in-one host uses central.host.yml (127.0.0.1:6100)
    depends_on:
      clickhouse: {condition: service_healthy}
    networks: [central]
  ingress:   # mTLS entry for remote nodes (R10): nginx stream → vector-central:6000
    image: owasp/modsecurity-crs:4.30.0-nginx-alpine-202611190211
    entrypoint: ["nginx", "-g", "daemon off;", "-c", "/etc/waf/ingress/nginx.conf"]
    user: root    # the master reads the 0600 key; workers drop to nginx
    restart: unless-stopped
    healthcheck: {disable: true}
    tmpfs: [/tmp]
    volumes:
      - ${WAF_CENTRAL_DIR}/ingress/nginx.conf:/etc/waf/ingress/nginx.conf:ro
      - ${WAF_CENTRAL_DIR}/ingress/certs:/etc/waf/pki:ro   # ingress.pem/.key, ca.pem, crl.pem only (never the CA key)
    ports: ["${INGRESS_BIND:-0.0.0.0}:${INGRESS_PORT:-6000}:6000"]
    depends_on: [vector-central]
    networks: [central]
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    user: "0:0"   # data dir is created by wafctl (not owned by the image's nobody user)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ${WAF_CENTRAL_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${WAF_CENTRAL_DIR}/prometheus/data:/prometheus
    networks: [central]
  grafana:
    image: grafana/grafana:13.2.7
    restart: unless-stopped
    user: "0:0"   # bind-mounted data dir created by wafctl/docker (not owned by uid 472)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?run wafctl secrets init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.24.0
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3000/}
      WAF_CH_RO_PASSWORD: ${WAF_CH_RO_PASSWORD:?}
    volumes:
      - ${WAF_CENTRAL_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${WAF_CENTRAL_DIR}/grafana/data:/var/lib/grafana
      - ../grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports: ["${GF_BIND:-127.0.0.1:3000}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      clickhouse: {condition: service_healthy}
    networks: [central]
  apprise:
    image: caronc/apprise:2.2.0
    restart: unless-stopped
    environment:
      APPRISE_STATEFUL_MODE: simple
    volumes:
      - ${WAF_CENTRAL_DIR}/apprise:/config
    networks: [central]
  alert-sink:   # lab/test only: apprise json:// target that logs each notification
    image: python:3.13-alpine
    profiles: [test]
    restart: unless-stopped
    command: ["python", "-u", "/alert_sink.py"]
    volumes:
      - ./lab/alert_sink.py:/alert_sink.py:ro
    networks: [central]
networks:
  central:
    name: waf_central
