# WAF node (project "waf"). Use with node.host.yml (production) or node.bridge.yml (lab).
name: waf
services:
  waf:
    build:
      context: ../..
      dockerfile: waf/Dockerfile
    image: nginx-aws-waf/waf:${WAF_VERSION:-dev}
    restart: unless-stopped
    tmpfs: [/tmp]
    ulimits:
      nofile: 65535
    volumes:
      - ${WAF_DATA_DIR}/runtime:/etc/waf/runtime:ro
      - ${WAF_DATA_DIR}/lists:/etc/waf/lists:ro
      - ${WAF_DATA_DIR}/certs:/etc/waf/certs:ro
      - ${WAF_DATA_DIR}/geoip:/etc/waf/geoip:ro
      - ${WAF_DATA_DIR}/logs:/var/log/waf
  vector:
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml", "--config", "/etc/waf/runtime/current/vector/forward.yaml"]
    volumes:
      - ../vector/node.yaml:/etc/vector/vector.yaml:ro
      - ${WAF_DATA_DIR}/runtime:/etc/waf/runtime:ro
      - ${WAF_DATA_DIR}/logs:/var/log/waf:ro
      - ${WAF_DATA_DIR}/raw:/var/lib/waf/raw
      - ${WAF_DATA_DIR}/vector:/var/lib/vector
